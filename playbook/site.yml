- name: Install Clickhouse and Vector
  hosts: clickhouse
  become: true

  tasks:
    - name: Install necessary dependencies
      ansible.builtin.apt:
        name:
          - python3-paramiko
          - python3-pycurl
          - python3-pip
        state: present

    - name: Install python3-venv
      ansible.builtin.apt:
        name: python3-venv
        state: present

    - name: Create a virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/venv
      args:
        creates: /opt/venv/bin/activate

    - name: Install Paramiko in virtual environment
      ansible.builtin.command:
        cmd: /opt/venv/bin/pip install paramiko
      register: paramiko_install
      changed_when: "'Successfully installed' in paramiko_install.stdout"

    - name: Get Clickhouse common static distrib
      ansible.builtin.get_url:
        url: "https://github.com/ClickHouse/ClickHouse/releases/download/v25.1.7.20-stable/clickhouse-common-static_25.1.7.20_amd64.deb"
        dest: "/tmp/clickhouse-common-static.deb"
        mode: '0644'

    - name: Get Clickhouse client distrib
      ansible.builtin.get_url:
        url: "https://github.com/ClickHouse/ClickHouse/releases/download/v25.1.7.20-stable/clickhouse-client_25.1.7.20_amd64.deb"
        dest: "/tmp/clickhouse-client.deb"
        mode: '0644'

    - name: Get Clickhouse server distrib
      ansible.builtin.get_url:
        url: "https://github.com/ClickHouse/ClickHouse/releases/download/v25.1.7.20-stable/clickhouse-server_25.1.7.20_amd64.deb"
        dest: "/tmp/clickhouse-server.deb"
        mode: '0644'

    - name: Install Clickhouse common static
      ansible.builtin.command:
        cmd: dpkg -i /tmp/clickhouse-common-static.deb

    - name: Install Clickhouse client
      ansible.builtin.command:
        cmd: dpkg -i /tmp/clickhouse-client.deb

    - name: Install Clickhouse server
      ansible.builtin.command:
        cmd: dpkg -i /tmp/clickhouse-server.deb

    - name: Ensure Clickhouse service is running
      ansible.builtin.service:
        name: clickhouse-server
        state: started
